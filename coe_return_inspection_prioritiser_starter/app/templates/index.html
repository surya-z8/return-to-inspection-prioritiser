<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Return-to-Inspection Prioritiser</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    margin:0;
    padding:32px;
    background:#f4f7fb;
    color:#172033;
}

/* Main cards */

.card{
    background:#ffffff;
    padding:26px;
    border-radius:18px;
    margin-bottom:22px;
    box-shadow:0 8px 25px rgba(15,23,42,0.07);
    border:1px solid #e7ebf2;
    animation:fadeUp .5s ease;
    transition:transform .25s ease,box-shadow .25s ease;
}

.card:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(15,23,42,0.10);
}

/* Header */

.hero{
    background:linear-gradient(135deg,#ffffff,#eef5ff);
    border-left:6px solid #2563eb;
}

h1{
    font-size:34px;
    margin:0 0 8px;
    letter-spacing:-0.8px;
}

h2{
    margin-top:0;
    font-size:24px;
}

h3{
    margin-bottom:8px;
}

.muted{
    color:#667085;
    font-size:16px;
}

/* Buttons */

button{
    padding:11px 17px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    margin-right:8px;
    transition:all .25s ease;
}

button:first-of-type{
    background:#e9eef7;
    color:#26364d;
}

button:last-of-type{
    background:#2563eb;
    color:white;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 6px 15px rgba(37,99,235,.22);
}

button:active{
    transform:scale(.97);
}

/* Table */

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:separate;
    border-spacing:0;
    overflow:hidden;
}

th{
    background:#f5f7fb;
    color:#475467;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

th,td{
    padding:14px 12px;
    border-bottom:1px solid #edf0f4;
    text-align:left;
}

tbody tr{
    transition:background .2s ease,transform .2s ease;
}

tbody tr:hover{
    background:#f8fbff;
}

/* Priority badges */

.badge{
    display:inline-block;
    padding:6px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    letter-spacing:.4px;
}

.badge.high{
    background:#fee2e2;
    color:#b42318;
}

.badge.medium{
    background:#fef3c7;
    color:#92400e;
}

.badge.low{
    background:#dcfce7;
    color:#166534;
}

/* Experiment */

.experiment{
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid #edf0f4;
}

.metric-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin:18px 0;
}

.metric{
    background:#f8fafc;
    border:1px solid #e7ebf2;
    border-radius:14px;
    padding:18px;
    transition:all .25s ease;
}

.metric:hover{
    transform:translateY(-3px);
    box-shadow:0 7px 18px rgba(15,23,42,.08);
}

.metric-label{
    color:#667085;
    font-size:13px;
    margin-bottom:7px;
}

.metric-value{
    font-size:25px;
    font-weight:800;
    color:#172033;
}

.improvement{
    background:#ecfdf3;
    border-color:#b7ebc6;
}

.improvement .metric-value{
    color:#15803d;
}

/* Inspection order */

.order-box{
    background:#f8fafc;
    border:1px solid #e7ebf2;
    border-radius:12px;
    padding:14px 16px;
    margin-top:10px;
    font-family:monospace;
    color:#344054;
    overflow-x:auto;
}

/* Evidence */

.evidence-item{
    background:#f8fafc;
    border-left:4px solid #2563eb;
    border-radius:12px;
    padding:17px;
    margin-bottom:13px;
    transition:all .25s ease;
}

.evidence-item:hover{
    background:#f1f6ff;
    transform:translateX(4px);
}

.evidence-title{
    font-size:17px;
    font-weight:800;
}

.evidence-score{
    color:#2563eb;
}

.evidence-item ul{
    margin-bottom:0;
    color:#475467;
    line-height:1.6;
}

/* Animation */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* Responsive */

@media(max-width:900px){
    .metric-grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    body{
        padding:16px;
    }

    h1{
        font-size:27px;
    }

    .metric-grid{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<!-- Header -->

<div class="card hero">

    <h1>Return-to-Inspection Prioritiser</h1>

    <p class="muted">
        Prioritises returned reusable containers using
        value-loss and condition risk.
    </p>

    <button onclick="loadData()">↻ Refresh</button>

    <button onclick="loadExperiment()">
        Run FIFO vs Priority Experiment
    </button>

    <div id="experiment-result"></div>

</div>


<!-- Prioritised Returns -->

<div class="card">

    <h2>Prioritised Returns</h2>

    <div class="table-wrap">

        <table>

            <thead>
                <tr>
                    <th>Return ID</th>
                    <th>Value</th>
                    <th>Transit Days</th>
                    <th>Condition</th>
                    <th>Score</th>
                    <th>Priority</th>
                    <th>Fallback</th>
                </tr>
            </thead>

            <tbody id="rows"></tbody>

        </table>

    </div>

</div>


<!-- Evidence -->

<div class="card">

    <h2>Evidence for High-Priority Outputs</h2>

    <div id="evidence"></div>

</div>


<script>

async function loadData(){

    const data = await fetch('/api/returns')
        .then(r => r.json());

    document.getElementById('rows').innerHTML = data.map(x => {

        const priorityClass =
            String(x.priority).toLowerCase();

        return `
        <tr>

            <td><strong>${x.return_id}</strong></td>

            <td>$${Number(x.product_value).toFixed(0)}</td>

            <td>${x.transit_days}</td>

            <td>${x.condition_hint}</td>

            <td><strong>${x.priority_score}</strong></td>

            <td>
                <span class="badge ${priorityClass}">
                    ${x.priority}
                </span>
            </td>

            <td>
                ${x.manual_review
                    ? '⚠ Manual review'
                    : 'Normal'}
            </td>

        </tr>
        `;

    }).join('');


    document.getElementById('evidence').innerHTML =
        data
        .filter(x => x.priority === 'HIGH')
        .map(x => `

            <div class="evidence-item">

                <div class="evidence-title">

                    ${x.return_id}

                    <span class="evidence-score">
                        — Score ${x.priority_score}
                    </span>

                </div>

                <ul>
                    ${x.evidence
                        .map(e => `<li>${e}</li>`)
                        .join('')}
                </ul>

            </div>

        `)
        .join('')

        || '<p class="muted">No high-priority returns.</p>';
}


async function loadExperiment(){

    const response =
        await fetch("/api/experiment");

    const result =
        await response.json();


    document.getElementById("experiment-result").innerHTML = `

        <div class="experiment">

            <h2>FIFO vs Priority Experiment</h2>

            <div class="metric-grid">

                <div class="metric">

                    <div class="metric-label">
                        FIFO Value Preserved
                    </div>

                    <div class="metric-value">
                        $${result.fifo.total_value_preserved}
                    </div>

                </div>


                <div class="metric">

                    <div class="metric-label">
                        Priority Value Preserved
                    </div>

                    <div class="metric-value">
                        $${result.priority.total_value_preserved}
                    </div>

                </div>


                <div class="metric improvement">

                    <div class="metric-label">
                        Value Improvement
                    </div>

                    <div class="metric-value">
                        $${result.improvement}
                    </div>

                </div>


                <div class="metric improvement">

                    <div class="metric-label">
                        Improvement %
                    </div>

                    <div class="metric-value">
                        ${result.improvement_percent}%
                    </div>

                </div>

            </div>


            <h3>FIFO Inspection Order</h3>

            <div class="order-box">
                ${result.fifo.inspection_order.join(" → ")}
            </div>


            <h3>Priority Inspection Order</h3>

            <div class="order-box">
                ${result.priority.inspection_order.join(" → ")}
            </div>

        </div>

    `;
}


loadData();

</script>

</body>
</html>
